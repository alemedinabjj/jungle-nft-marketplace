name: Update visual baselines

# Visual baselines are rendered on the same runner image as CI (ubuntu-latest +
# Playwright Chromium with its system fonts), so `toHaveScreenshot` compares
# like with like. Run manually after an intentional UI change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/visual --update-snapshots=all
      - name: Commit updated baselines
        run: |
          git config user.name "alemedinabjj"
          git config user.email "101877712+alemedinabjj@users.noreply.github.com"
          git add e2e/visual/__snapshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test(visual): refresh baselines on the ci runner"
            git push
          fi
