<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140D0A" />
    <meta
      name="description"
      content="Kurio — marketplace de NFTs: descubra arte digital rara, compare edições e compre com sua carteira."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/roboto-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- LCP: hero artwork is a static asset, preloaded independently of the API / mock worker -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/nfts/emerald-ape-320.avif 320w, /images/nfts/emerald-ape-640.avif 640w, /images/nfts/emerald-ape-800.avif 800w"
      imagesizes="(min-width: 768px) 450px, 92vw"
      fetchpriority="high"
    />
    <title>Kurio — Marketplace de NFTs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
